services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hbn-thickness-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-uploaded-mappings:/app/backend/data/uploaded
      - backend-trained-models:/app/backend/data/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: hbn-thickness-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-uploaded-mappings:
  backend-trained-models:
